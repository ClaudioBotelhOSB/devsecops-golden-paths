# ==============================================================================
# .github/workflows/secret-scan.yml
# Zero-Trust Delivery Platform - Server-side Secret Firewall
# Owner: platform engineering
#
# This workflow is the server-side counterpart of the pre-commit gitleaks
# hook. Pre-commit hooks can be bypassed with `git commit --no-verify`;
# this one cannot be, because it runs on GitHub's infrastructure as a
# required status check.
#
# It runs on every push, pull_request, and merge_group. It scans the full
# history on push to catch past secrets that a force-push attempted to
# smuggle into default branches; on PRs, it scans only the diff for speed.
# ==============================================================================

name: Secret scan (gitleaks)

on:
  pull_request:
  push:
    branches: [main, release/*]
  merge_group:
  schedule:
    - cron: "17 3 * * *"   # daily deep sweep of full history
  workflow_dispatch:

# workflow-level permissions: read-only baseline; jobs escalate as needed.
permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write    # upload SARIF to code scanning
    steps:
      - name: Checkout (full history on push, shallow on PR)
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      # Fail-closed install: we fetch both the tarball and the official
      # SHA256SUMS artifact from the gitleaks release, verify offline, and
      # only then extract. Any mismatch exits non-zero and the job fails.
      - name: Install gitleaks (pinned, fail-closed)
        run: |
          set -euo pipefail
          VERSION="8.21.2"
          TARBALL="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"

          curl --proto '=https' --tlsv1.2 -fsSL -o "/tmp/${TARBALL}"  "${BASE}/${TARBALL}"
          curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/gitleaks-checksums.txt \
            "${BASE}/gitleaks_${VERSION}_checksums.txt"

          EXPECTED=$(awk -v f="${TARBALL}" '$2==f {print $1}' /tmp/gitleaks-checksums.txt)
          if [ -z "${EXPECTED}" ]; then
            echo "::error title=gitleaks install::no checksum entry for ${TARBALL} in the upstream SHA256SUMS file"
            exit 1
          fi

          ACTUAL=$(sha256sum "/tmp/${TARBALL}" | awk '{print $1}')
          if [ "${EXPECTED}" != "${ACTUAL}" ]; then
            echo "::error title=gitleaks install::checksum mismatch expected=${EXPECTED} actual=${ACTUAL}"
            exit 1
          fi

          sudo tar -xzf "/tmp/${TARBALL}" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Determine scan scope
        id: scope
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
              echo "mode=protect"        >> "$GITHUB_OUTPUT"
              echo "base=${BASE}"        >> "$GITHUB_OUTPUT"
              ;;
            merge_group)
              echo "mode=protect"        >> "$GITHUB_OUTPUT"
              echo "base=HEAD~1"         >> "$GITHUB_OUTPUT"
              ;;
            push|schedule|workflow_dispatch)
              echo "mode=detect"         >> "$GITHUB_OUTPUT"
              echo "base="               >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run gitleaks (diff scan on PR, full scan on push/schedule)
        id: scan
        env:
          MODE: ${{ steps.scope.outputs.mode }}
          BASE: ${{ steps.scope.outputs.base }}
        run: |
          set -euo pipefail
          mkdir -p .gitleaks
          if [ "${MODE}" = "protect" ]; then
            gitleaks protect \
              --source=. \
              --staged=false \
              --redact \
              --verbose \
              --report-format=sarif \
              --report-path=.gitleaks/gitleaks.sarif \
              --log-opts="${BASE}..HEAD" \
              --exit-code=1
          else
            gitleaks detect \
              --source=. \
              --redact \
              --verbose \
              --report-format=sarif \
              --report-path=.gitleaks/gitleaks.sarif \
              --exit-code=1
          fi

      - name: Upload SARIF to Code Scanning
        if: always()
        # github/codeql-action/upload-sarif@v3.27.5
        uses: github/codeql-action/upload-sarif@f09c1c0a94de965c15400f5634aa42fac8fb8f88
        with:
          sarif_file: .gitleaks/gitleaks.sarif
          category: gitleaks

      - name: Fail-closed summary
        if: failure()
        run: |
          echo "::error title=Secret detected::gitleaks flagged one or more findings. The push/PR is blocked."
          echo "See Code Scanning alerts for redacted details. Rotate any exposed credential BEFORE touching this PR again."
          exit 1
