# ==============================================================================
# k8s/testdata/pod-unsigned.yaml
# Sample Pod used by `make policy-test` to verify the Kyverno signed-images
# policy against a non-conformant input. MUST be DENIED by the policy:
#   - uses an untrusted registry (docker.io/library/...)
#   - not digest-pinned
#   - runs as root and without readOnlyRootFilesystem
#   - capabilities are not dropped
# Owner: platform engineering
# ==============================================================================
apiVersion: v1
kind: Pod
metadata:
  name: api-unsigned
  namespace: prod-example
  labels:
    app.kubernetes.io/name: <APP_NAME>
spec:
  containers:
    - name: api
      image: docker.io/library/nginx:latest
      ports:
        - { name: http, containerPort: 8080 }
