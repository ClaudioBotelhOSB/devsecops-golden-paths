{{- if .Values.networkPolicy.enabled -}}
# This policy is fully user-supplied: it serializes whatever is under
# `.Values.networkPolicy.spec`, so the chart makes no assumption about
# ingress-nginx, monitoring, kube-system, or the cloud metadata CIDR.
# See values.yaml for the default (empty) structure.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" . }}-default-deny
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
